# Publishes a GitHub release when `pnpm release` pushes a vX.Y.Z tag.
# Notes: the commits since the previous tag, followed by GitHub's generated notes (merged PRs,
# grouped by .github/release.yml, and a compare link). Edit the release on GitHub to polish them.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List commits since the previous release
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range" | grep -v '^- Release v'
          } > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "PostHub $GITHUB_REF_NAME"
          --notes-file notes.md --generate-notes
